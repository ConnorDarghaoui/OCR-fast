name: Release

on:
  push:
    tags:
      - "v*"   # Disparado por: git tag v1.0.0 && git push --tags

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Compilar binario de release en cada plataforma ──────────────────────────
  build-release:
    name: Release — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: ocrfast
            lib: libpdfium.so
            asset: ocrfast-linux-x86_64
            ext: tar.gz

          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: ocrfast.exe
            lib: pdfium.dll
            asset: ocrfast-windows-x86_64
            ext: zip

          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: ocrfast
            lib: libpdfium.dylib
            asset: ocrfast-macos-arm64
            ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libssl-dev

      - name: Instalar Rust toolchain estable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencias Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          cache-directories: |
            target/pdfium-download

      - name: Build release
        run: cargo build --release --verbose

      # ── Empaquetar en Unix (Linux / macOS) ───────────────────────────────────
      - name: Empaquetar (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.bin }} dist/
          # Incluir pdfium si el build.rs lo descargó al directorio raíz
          [ -f "${{ matrix.lib }}" ] && cp "${{ matrix.lib }}" dist/ || true
          tar -czf "${{ matrix.asset }}.tar.gz" -C dist .

      # ── Empaquetar en Windows ─────────────────────────────────────────────────
      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\release\${{ matrix.bin }}" dist\
          if (Test-Path "${{ matrix.lib }}") {
            Copy-Item "${{ matrix.lib }}" dist\
          }
          Compress-Archive -Path dist\* -DestinationPath "${{ matrix.asset }}.zip"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.${{ matrix.ext }}
          if-no-files-found: error

  # ─── Crear el GitHub Release con todos los artefactos ────────────────────────
  create-release:
    name: Publicar GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ocrfast-linux-x86_64/ocrfast-linux-x86_64.tar.gz
            ocrfast-windows-x86_64/ocrfast-windows-x86_64.zip
            ocrfast-macos-arm64/ocrfast-macos-arm64.tar.gz
